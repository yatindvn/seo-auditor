# Backend + TLS terminator for an Oracle Cloud Always Free VM.
#
# Caddy exists here for one non-negotiable reason: the frontend is served over
# HTTPS, and a page on https:// may not open a ws:// socket -- browsers block it
# as mixed content. Live crawl progress would silently never arrive. Caddy
# obtains a certificate automatically and upgrades the socket to wss://.
services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8000
      # Must name the frontend's exact origin. See app/main.py:_cors_options.
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      GOOGLE_CSE_API_KEY: ${GOOGLE_CSE_API_KEY:-}
      GOOGLE_CSE_CX: ${GOOGLE_CSE_CX:-}
      GOOGLE_CSE_DAILY_QUOTA: ${GOOGLE_CSE_DAILY_QUOTA:-100}
      GOOGLE_CSE_MAX_KEYWORDS_PER_PAGE: ${GOOGLE_CSE_MAX_KEYWORDS_PER_PAGE:-3}
      GOOGLE_CSE_CACHE_TTL_HOURS: ${GOOGLE_CSE_CACHE_TTL_HOURS:-24}
      CRAWL_TIMEOUT: ${CRAWL_TIMEOUT:-10}
      # Audit history lives in SQLite files here. Mounted from a named
      # volume so it survives a container rebuild -- history used to be an
      # in-memory list and every deploy erased it.
      SESSION_DIR: /data/sessions
      # Central DB (projects, audit history). Unset = SQLite in the sessions
      # volume; set to the postgres service below to use Postgres.
      DATABASE_URL: ${DATABASE_URL:-}
      # Bearer token for POST /api/cron/run; unset leaves the route disabled.
      CRON_SECRET: ${CRON_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      # Rank tracking. Paid providers stay in dry run until SERP_DRY_RUN=false.
      SERP_PROVIDER: ${SERP_PROVIDER:-}
      SERP_DRY_RUN: ${SERP_DRY_RUN:-true}
      SERP_DAILY_CAP: ${SERP_DAILY_CAP:-50}
      RANK_DEPTH: ${RANK_DEPTH:-100}
      DATAFORSEO_LOGIN: ${DATAFORSEO_LOGIN:-}
      DATAFORSEO_PASSWORD: ${DATAFORSEO_PASSWORD:-}
      DATAFORSEO_LABS_DAILY_CAP: ${DATAFORSEO_LABS_DAILY_CAP:-20}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    # Deliberately NOT published to the host: only Caddy may reach it, so the
    # plaintext port is never exposed to the internet.
    expose:
      - "8000"
    volumes:
      - sessions:/data/sessions
    # The crawler registry, the rank cache and the live WebSocket connection
    # list are all in process memory, so a replica count above 1 would serve
    # requests that cannot see them. Never scale this service. (Finished
    # audits are on the volume above and would survive; the live ones would
    # not, which is the half that breaks.)
    deploy:
      replicas: 1

  # Optional. Start with: docker compose --profile postgres up -d
  # and set DATABASE_URL=postgresql+psycopg://seo:${POSTGRES_PASSWORD}@postgres/seo
  # Without it the backend keeps using SQLite on the sessions volume.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: ["postgres"]
    environment:
      POSTGRES_USER: seo
      POSTGRES_DB: seo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seo"]
      interval: 10s
      retries: 5

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      BACKEND_DOMAIN: ${BACKEND_DOMAIN}
    depends_on:
      - backend

volumes:
  sessions:
  pgdata:
  caddy_data:
  caddy_config:
